repos:
  - repo: local
    hooks:
      - id: bash-syntax
        name: Bash syntax
        entry: bash -c 'for file in "$@"; do bash -n "$file" || exit 1; done' --
        language: system
        files: \.sh$

      - id: shellcheck-strict
        name: ShellCheck strict
        entry: bash -c 'root=$(git rev-parse --show-toplevel); exec nix develop "path:$(cd "$root/.." && pwd)/nix#quality" --command shellcheck --rcfile "$root/.shellcheckrc" "$@"' --
        language: system
        files: \.sh$

      - id: shfmt-check
        name: shfmt check
        entry: bash -c 'root=$(git rev-parse --show-toplevel); exec nix develop "path:$(cd "$root/.." && pwd)/nix#quality" --command shfmt -d -i 4 -ci -sr "$@"' --
        language: system
        files: \.sh$
