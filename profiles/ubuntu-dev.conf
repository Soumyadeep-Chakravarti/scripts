PROFILE_NAME=ubuntu-dev
PROFILE_DESCRIPTION='Ubuntu development environment'
PROFILE_OS_ID=ubuntu
PROFILE_REQUIRES_WSL=0
PROFILE_PACKAGE_MANAGER=apt
PROFILE_FOUNDATION_PACKAGES=(git curl wget unzip zip)
PROFILE_SHELL_PACKAGES=(zsh starship zellij fzf zoxide atuin direnv)
PROFILE_CLI_PACKAGES=(eza bat ripgrep fd-find jq)
PROFILE_DEV_PACKAGES=(neovim gh nix-bin)
PROFILE_PACKAGES=(
    "${PROFILE_FOUNDATION_PACKAGES[@]}"
    "${PROFILE_SHELL_PACKAGES[@]}"
    "${PROFILE_CLI_PACKAGES[@]}"
    "${PROFILE_DEV_PACKAGES[@]}"
)
PROFILE_COMMANDS=(
    git curl wget unzip zip
    zsh starship zellij fzf zoxide atuin direnv
    eza bat rg fd jq
    nvim gh nix
)
